# ============================================================
# SERVIDOR
# ============================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=sistema-guias

# ============================================================
# BASE DE DATOS - PRUEBAS LOCALES (H2)
# ============================================================
spring.datasource.url=jdbc:h2:mem:guias_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA CONFIGURACI\u00d3N
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
# EFS CONFIGURACI\u00d3N (Almacenamiento temporal)
# ============================================================
app.efs.mount-path=/app/efs

# ============================================================
# LOGGING
# ============================================================
logging.level.com.transportista.sistemaguias=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB