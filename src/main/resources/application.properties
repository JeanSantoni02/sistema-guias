# ============================================================
# SERVIDOR
# ============================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=sistema-guias

# ============================================================
# BASE DE DATOS H2 (Principal)
# ============================================================
spring.datasource.url=jdbc:h2:file:/app/data/guias_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA CONFIGURACI\u00d3N
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
# AWS S3 CONFIGURACI\u00d3N
# ============================================================
aws.s3.region=us-east-1
aws.s3.bucket-name=guias-transportista-jsantoni

# ============================================================
# EFS CONFIGURACI\u00d3N (Almacenamiento temporal)
# ============================================================
app.efs.mount-path=/app/efs

# ============================================================
# ===== NUEVO: RABBITMQ =====
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin}

rabbitmq.queue.principal=guias.queue
rabbitmq.queue.dlq=guias.dlq
rabbitmq.exchange=guias.exchange
rabbitmq.routingkey=guias.routingkey

# ============================================================
# ===== NUEVO: ORACLE CLOUD DATABASE =====
# ============================================================
# spring.datasource.oracle.url=jdbc:oracle:thin:@//<HOST>:<PUERTO>/<SERVICE_NAME>
# spring.datasource.oracle.username=<USUARIO>
# spring.datasource.oracle.password=<CONTRASE\u00d1A>
# spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver
# (Estas variables se configurar\u00e1n en producci\u00f3n)

# ============================================================
# JWT (Spring Security)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/2f296fb5-af38-4a42-ac9c-f29fcaeb8f96/v2.0

# ============================================================
# LOGGING
# ============================================================
logging.level.com.transportista.sistemaguias=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB